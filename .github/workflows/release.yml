name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - run: dotnet run --project tests/TransferTests.csproj --nologo
      - shell: pwsh
        run: dotnet publish OpenShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release\OpenShare --nologo
      - shell: pwsh
        run: if (!(Test-Path release\OpenShare\OpenShare.exe)) { throw 'OpenShare.exe missing' }
      - shell: pwsh
        run: Copy-Item README.md,LICENSE,RELEASE-NOTES.md,VALIDATION.md release\OpenShare
      - shell: pwsh
        run: Compress-Archive -Path release\OpenShare\* -DestinationPath OpenShare-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          body_path: RELEASE-NOTES.md
          files: |
            OpenShare-${{ github.ref_name }}-win-x64.zip
            release/OpenShare/OpenShare.exe
